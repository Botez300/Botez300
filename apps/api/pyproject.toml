[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legion-api"
version = "0.1.0"
description = "Legion Quant Terminal HTTP API"
requires-python = ">=3.11"
dependencies = [
  "legion-indicators", "legion-data", "legion-scanner",
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.6", "pydantic-settings>=2.2", "email-validator>=2",
  "sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.1", "redis>=5", "pyjwt>=2.8", "argon2-cffi>=23.1",
]

[tool.setuptools.packages.find]
include = ["legion_api*"]
