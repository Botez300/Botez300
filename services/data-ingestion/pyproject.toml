[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legion-data"
version = "0.1.0"
description = "Legion Quant Terminal market-data provider abstraction, demo provider and data-quality checks"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["legion_data*"]
