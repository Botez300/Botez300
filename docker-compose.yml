# Local stack: `docker compose up --build`, then open http://localhost:3000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: legion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legion}
      POSTGRES_DB: legion
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legion -d legion"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    environment:
      ENV: ${ENV:-dev}
      DATABASE_URL: postgresql+psycopg://legion:${POSTGRES_PASSWORD:-legion}@db:5432/legion
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-dev-only-secret}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATA_PROVIDER: ${DATA_PROVIDER:-demo}
      ALPACA_API_KEY_ID: ${ALPACA_API_KEY_ID:-}
      ALPACA_API_SECRET_KEY: ${ALPACA_API_SECRET_KEY:-}
      ALPACA_FEED: ${ALPACA_FEED:-iex}
      POLYGON_API_KEY: ${POLYGON_API_KEY:-}
      POLYGON_BASE_URL: ${POLYGON_BASE_URL:-https://api.polygon.io}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
      args:
        API_URL: http://api:8000
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "3000:3000"

volumes:
  pgdata:
