name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  LEGION_MODE: PAPER          # CI has no brokerage, Google or Robinhood credentials and never will
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "requirements*.txt" }
      - run: pip install -r requirements-dev.txt -r requirements-drive.txt
      - name: Lint
        run: ruff check legion tests scripts
      - name: Schema + fixture validation
        run: python scripts/validate_schema.py
      - name: Dependency consistency and vulnerability audit
        run: |
          pip check
          pip-audit -r requirements.txt
          pip-audit -r requirements-drive.txt
      - name: Tests (synthetic + recorded fixtures; no network, no broker, no Claude/Google/Robinhood auth)
        run: python -m pytest -v
      - name: Guard - no real order tool referenced outside the blocklist/injection patterns
        run: |
          ! grep -rnE "place_(equity|option|crypto|advanced)_order" legion --include=*.py | grep -v "legion/eligibility.py"
