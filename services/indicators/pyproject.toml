[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legion-indicators"
version = "0.1.0"
description = "Legion Quant Terminal indicator library (single source of truth for indicator definitions)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1"]

[tool.setuptools.packages.find]
include = ["legion_indicators*"]
