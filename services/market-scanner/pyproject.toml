[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legion-scanner"
version = "0.1.0"
description = "Legion Quant Terminal rule-based market scanner"
requires-python = ">=3.11"
dependencies = ["legion-indicators", "legion-data", "pydantic>=2.6"]

[tool.setuptools.packages.find]
include = ["legion_scanner*"]
